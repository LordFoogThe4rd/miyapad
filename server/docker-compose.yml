services:
  miyapad:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - 3000:3000
    # .env must set MIYAPAD_HOST=0.0.0.0 (see .env.example) — the server's
    # loopback-only default is unreachable through this port mapping otherwise.
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - storage:/storage

volumes:
  storage:
