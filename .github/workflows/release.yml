name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            archive: miyapad-linux-x64.tar.gz
          - os: macos-latest
            platform: macos
            archive: miyapad-macos-x64.tar.gz
          - os: windows-latest
            platform: win
            archive: miyapad-win-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Bundle server
        working-directory: server
        run: npm run bundle

      - name: Slim node_modules to production-only
        working-directory: server
        run: npm ci --omit=dev

      - name: Package distribution
        working-directory: server
        run: node scripts/pack-dist.mjs

      - name: Archive (tar.gz)
        if: matrix.platform != 'win'
        run: tar -czf ${{ matrix.archive }} -C server/miyapad-dist .

      - name: Archive (zip)
        if: matrix.platform == 'win'
        shell: pwsh
        run: Compress-Archive -Path server/miyapad-dist/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@15ea491d1c9d239c967d4f6705e659c0bd6865ea # v5.0.0
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: actions/download-artifact@291f5de43e9f360d0246de49095b1303d22c3989 # v6.0.0
        with:
          pattern: '*'
          merge-multiple: true

      - name: Extract changelog section
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1; next }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for $TAG" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            dist/miyapad.html
            miyapad-linux-x64.tar.gz
            miyapad-macos-x64.tar.gz
            miyapad-win-x64.zip
          body_path: release_notes.md
