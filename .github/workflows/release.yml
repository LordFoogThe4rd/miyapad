name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            archive: miyapad-linux-x64.tar.gz
          - os: macos-latest
            platform: macos
            archive: miyapad-macos-arm64.tar.gz
          - os: windows-latest
            platform: win
            archive: miyapad-win-x64.zip
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Build sqlite-zstd
        working-directory: server/sqlite-zstd
        run: cargo build --release --features build_extension

      - name: Copy sqlite-zstd extension
        working-directory: server
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux) cp sqlite-zstd/target/release/libsqlite_zstd.so . ;;
            macos) cp sqlite-zstd/target/release/libsqlite_zstd.dylib . ;;
            win)   cp sqlite-zstd/target/release/sqlite_zstd.dll . ;;
          esac

      - name: Bundle server
        working-directory: server
        run: npm run bundle

      - name: Slim node_modules to production-only
        working-directory: server
        run: npm ci --omit=dev

      - name: Package distribution
        working-directory: server
        run: node scripts/pack-dist.mjs

      - name: Archive (tar.gz)
        if: matrix.platform != 'win'
        run: tar -czf ${{ matrix.archive }} -C server/miyapad-dist .

      - name: Archive (zip)
        if: matrix.platform == 'win'
        shell: pwsh
        run: Compress-Archive -Path server/miyapad-dist/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: '*'
          merge-multiple: true

      - name: Extract changelog section
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1; next }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for $TAG" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            dist/miyapad.html
            miyapad-*.tar.gz
            miyapad-*.zip
          body_path: release_notes.md
