# ponytail: mirrors the build matrix from release.yml. If a third consumer
# appears, factor the matrix into a reusable workflow; until then the copy is
# cheaper than refactoring the stable release path.
name: Edge pre-release

on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-${{ github.event_name == 'delete' && github.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'delete'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            archive: miyapad-linux-x64.tar.gz
          - os: macos-latest
            platform: macos
            archive: miyapad-macos-arm64.tar.gz
          - os: windows-latest
            platform: win
            archive: miyapad-win-x64.zip
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Compute edge version
        id: version
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          echo "MIYAPAD_VERSION=${BASE}-edge-${GITHUB_REF_NAME}-${SHA}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: server/sqlite-zstd

      - name: Build sqlite-zstd
        working-directory: server/sqlite-zstd
        run: cargo build --release --features build_extension

      - name: Copy sqlite-zstd extension
        working-directory: server
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            linux) cp sqlite-zstd/target/release/libsqlite_zstd.so . ;;
            macos) cp sqlite-zstd/target/release/libsqlite_zstd.dylib . ;;
            win)   cp sqlite-zstd/target/release/sqlite_zstd.dll . ;;
          esac

      - name: Bundle server
        working-directory: server
        run: npm run bundle

      - name: Slim node_modules to production-only
        working-directory: server
        run: npm ci --omit=dev

      - name: Package distribution
        working-directory: server
        run: node scripts/pack-dist.mjs

      - name: Archive (tar.gz)
        if: matrix.platform != 'win'
        run: tar -czf ${{ matrix.archive }} -C server/miyapad-dist .

      - name: Archive (zip)
        if: matrix.platform == 'win'
        shell: pwsh
        run: Compress-Archive -Path server/miyapad-dist/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}

  release:
    if: github.event_name != 'delete'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute edge tag
        id: edge
        run: |
          SAFE=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-' | tr -c 'A-Za-z0-9_.-' '-')
          echo "EDGE_TAG=edge-$SAFE" >> "$GITHUB_ENV"

      - name: Delete stale edge release
        run: gh release delete "$EDGE_TAG" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Build for dist artifact
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          export MIYAPAD_VERSION="${BASE}-edge-${GITHUB_REF_NAME}-${SHA}"
          npm ci && npm run build

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: '*'
          merge-multiple: true

      - name: Write release notes
        run: |
          {
            echo "Built from \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`"
            echo ""
            echo "Bleeding-edge pre-release — not offered by the in-app updater."
            echo ""
            echo "## Recent commits"
            git log --oneline -10 $GITHUB_SHA
          } > release_notes.md

      - name: Check branch still exists
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Branch may have been deleted while this run was building; the
          # cleanup job deletes the release, then this job would recreate it.
          if gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "alive=true" >> "$GITHUB_OUTPUT"
          else
            echo "alive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pre-release
        if: steps.branch.outputs.alive == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.EDGE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Edge: ${{ github.ref_name }} @ ${{ github.sha }}"
          body_path: release_notes.md
          files: |
            dist/miyapad.html
            miyapad-*.tar.gz
            miyapad-*.zip
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete edge release for deleted branch
        env:
          DELETED_REF: ${{ github.event.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_REF_NAME points at the default branch on delete events;
          # github.event.ref is the only reliable source of the deleted branch.
          BRANCH="${DELETED_REF#refs/heads/}"
          SAFE=$(printf '%s' "$BRANCH" | tr '/' '-' | tr -c 'A-Za-z0-9_.-' '-')
          echo "Cleanup tag: edge-$SAFE"
          gh release delete "edge-$SAFE" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            || echo "No edge release to clean up for $BRANCH"
